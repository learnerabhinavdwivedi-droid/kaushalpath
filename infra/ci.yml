name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest
      # Eval needs the seeded catalogue + trained ranker; run from repo root so
      # eval/scripts + backend are both importable. run_eval gates G1/G2/G3/G5/G6/G7
      # and exits non-zero on any miss, failing the job.
      - run: |
          cd ..
          backend/.venv/bin/python scripts/seed_all.py || python scripts/seed_all.py
          python -m app.ml.ranking.train || (cd backend && python -m app.ml.ranking.train)
          python eval/scripts/run_eval.py val

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
