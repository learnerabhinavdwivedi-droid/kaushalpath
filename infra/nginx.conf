# KaushalPath production Nginx (Phase 9 deployment).
#
# Mounted into the frontend container at /etc/nginx/conf.d/default.conf by
# docker-compose.prod.yml. Responsibilities the app image cannot own itself:
#   * SPA history fallback (client-side routing via wouter)
#   * single-origin reverse proxy /api -> backend (so the browser never does
#     cross-origin requests and the SPA build uses VITE_API_BASE=/api)
#   * TLS-tier security headers + a Content-Security-Policy for served HTML
# Long-lived hashed assets are cached; index.html is never cached.

# API upstream is the compose service name. Keep-alive avoids a TCP setup per req.
upstream kaushalpath_api {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never advertise the nginx version (minor info-disclosure hardening).
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- Security headers (HTML + proxied API share this block) -------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Vite emits linked JS/CSS; React may set inline style attributes. Scripts
    # are strictly self-hosted (no inline/eval) — no third-party tags in the SPA.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # --- API reverse proxy --------------------------------------------------
    # /api/<x> -> backend /<x> (trailing slash on proxy_pass strips /api).
    location /api/ {
        proxy_pass http://kaushalpath_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 5m;
        proxy_read_timeout 60s;
    }

    # Readiness passthrough for the container orchestrator / LB health check.
    location = /healthz {
        proxy_pass http://kaushalpath_api/health/ready;
        access_log off;
    }

    # --- Static assets + SPA fallback --------------------------------------
    # Hashed build assets (immutable) get long cache lifetimes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The PWA manifest + service worker must always revalidate so clients pick
    # up new deploys (autoUpdate registerType relies on a fresh sw.js).
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    location / {
        # Never cache the app shell.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
