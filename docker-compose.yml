# KaushalPath local stack (Phase 0 skeleton).
# Backend + frontend. DB/Redis/ML workers are added in later phases.
services:
  backend:
    build: ./backend
    container_name: kaushalpath-backend
    env_file: .env
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8001
    container_name: kaushalpath-frontend
    ports:
      - "5174:80"
    depends_on:
      - backend
